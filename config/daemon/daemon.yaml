# Default physical-CAN session. Simulation is selected only by run_simulation.sh.
runtime_mode: hardware
shm_name: /qhrr05
terminal_exec: /usr/bin/gnome-terminal.real
log_directory: ../../logs
terminal_layout:
  monitor: auto
  columns: 2
  gap_px: 12
  margin_px: 12
  zoom: 0.85
  include_daemon: true
monitoring:
  display_interval_sec: 2.0
  window_sec: 10.0
  sample_hz: 100.0
processes:
- name: can_hal
  exec_path: can_hal
  working_directory: ../..
  wait_ready: true
  terminal_title: QHRR05-CAN-HAL
  args:
  - config/can_hal/can_hal.yaml
  - '{shm_name}'
- name: control
  exec_path: control
  working_directory: ../..
  args:
  - config/control/control.yaml
  - '{shm_name}'
- name: input
  exec_path: input
  working_directory: ../..
  critical: false
  restart_limit: 0
  args:
  - '{shm_name}'
  - config/input/input.yaml
- name: shm_logger
  exec_path: shm_logger
  working_directory: ../..
  wait_ready: true
  critical: false
  restart_limit: 3
  restart_delay_ms: 1000
  args:
  - --config
  - config/shm_logger/shm_logger.yaml
  - --shm-name
  - '{shm_name}'
  - --daemon-config
  - '{daemon_config}'

- name: web_gui
  exec_path: /bin/bash
  working_directory: ../..
  critical: false
  keep_on_stack_stop: true
  restart_limit: 0
  args: [scripts/run_web_gui.sh, --shm-name, "{shm_name}", --control-config, config/control/control.yaml]
