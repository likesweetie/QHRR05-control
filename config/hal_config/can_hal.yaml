# Runtime transport and axis-to-CAN mapping. SHM is configured and owned by daemon.
interface: vcan0
frequency_hz: 500.0
statistics_hz: 0.5
# Reference bits/s for the load estimate; does not configure the CAN interface.
bus_load_bitrate: 1000000
motor_ids: [1, 2, 3]  # HR, HP, KP; SID = 0x140 + ID.
# Resolved relative to this YAML, independently of the process working directory.
motor_config: ../motor_config/ak10_9_v3.yaml
