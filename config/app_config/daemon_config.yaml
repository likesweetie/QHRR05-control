# Robot asset paths are relative to this file.
robots:
  qhrr-05:
    model_path: "../../models/qhrr-05/scene.xml"
    control_config_path: "../control_config/control_config.yaml"

# The simulator and homing controller share one physics loop and one window.
# exec_path is relative to the daemon executable, independent of the working directory.
processes:
  - name: task_controller
    exec_path: task_controller
