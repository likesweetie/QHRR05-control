# Daemon owns process lifetimes and SHM. Exact {shm_name} arguments use this value.
# exec_path is relative to the daemon binary; working_directory to this YAML.
shm_name: /qhrr05
terminal_exec: /usr/bin/gnome-terminal.real
log_directory: ../../logs
monitoring:
  display_interval_sec: 2.0  # Must be greater than 1 s; no periodic log scrolling.
  window_sec: 10.0
  sample_hz: 100.0  # Read-only daemon observer; busy mutex samples are skipped.

processes:
  - name: can_hal
    exec_path: can_hal
    working_directory: ../..
    wait_ready: true
    terminal_title: QHRR05-CAN-HAL
    args: [config/hal_config/can_hal.yaml, "{shm_name}"]

  - name: mujoco_simulate
    exec_path: mujoco_simulate
    working_directory: ../..
    wait_ready: true
    args: [--model, models/qhrr-05/scene.xml, --control-config, config/control_config/control_config.yaml, --shm-name, "{shm_name}", --hal-config, config/hal_config/can_hal.yaml, --simulation-config, config/simulation_config/simulation_config.yaml]

  - name: task_controller
    exec_path: task_controller
    working_directory: ../..
    args: [config/control_config/control_config.yaml, "{shm_name}"]

# Selected only by daemon --without-can; never used after a CAN startup failure.
debug_processes:
  - name: mujoco_simulate
    exec_path: mujoco_simulate
    working_directory: ../..
    wait_ready: true
    args: [--model, models/qhrr-05/scene.xml, --control-config, config/control_config/control_config.yaml, --shm-name, "{shm_name}", --without-can]

  - name: task_controller
    exec_path: task_controller
    working_directory: ../..
    args: [config/control_config/control_config.yaml, "{shm_name}", --without-can]
